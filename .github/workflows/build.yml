name: Build Kivy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Unzip project
        run: unzip -o "multi clone appp : project .zip" -d .

      - name: Install Buildozer
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev cmake libffi-dev libssl-dev
          pip install --upgrade buildozer cython

      - name: Build APK
        run: |
          [ -f buildozer.spec ] || buildozer init
          yes | buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: Kivy-APK
          path: bin/*.apk
